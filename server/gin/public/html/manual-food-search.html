<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Nutrient Advisor</title>
  <link rel="stylesheet" href="/public/css/manual-food-search.css" />
</head>
<body>

  <!-- Shared Navbar -->
  <nav class="navbar">
    <div class="navbar__container">
      <a href="/" id="navbar__logo">Kay-Phos</a>
      <div class="navbar__toggle" id="mobile-menu">
        <span class="bar"></span> <span class="bar"></span> <span class="bar"></span>
      </div>
      <ul class="navbar__menu">
        <li class="navbar__btn"><a href="/" class="button">History</a></li>
        <li class="navbar__btn"><a href="/" class="button">AI</a></li>
        <li class="navbar__btn"><a href="/" class="button">Search</a></li>
        <li class="navbar__btn"><a href="/" class="button">Meal</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Page Content -->
  <main class="app">
    <div class="header">
      <h2>What can I help with?</h2>
    </div>

    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Ask about food or quick meals..." />
      <button onclick="handleSearch()">Search</button>
    </div>

    <div class="filters">
      <label for="sortSelect">Sort by:</label>
      <select id="sortSelect" onchange="applyFilters()">
        <option value="">None</option>
        <option value="calories-asc">Calories (Low to High)</option>
        <option value="calories-desc">Calories (High to Low)</option>
        <option value="protein-desc">Protein (High to Low)</option>
        <option value="phosphorus-desc">Phosphorus (High to Low)</option>
        <option value="potassium-desc">Potassium (High to Low)</option>
        <option value="carbs-desc">Carbs (High to Low)</option>
      </select>
    </div>

    <div class="results-container" id="resultsContainer">
      <!-- Search results will render here -->
    </div>
  </main>

  <script src="/public/js/manual-food-search.js"></script>
</body>
</html>
