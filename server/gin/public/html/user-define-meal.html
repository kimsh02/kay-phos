<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/public/css/user-define-meal.css" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.14.0/css/all.css"
      integrity="sha384-HzLeBuhoNPvSl5KYnjx0BT+WB0QEEqLprO+NBkkk5gbc67FTaL7XIGa2w1L0Xbgc"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="/public/js/user-define-meal.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar__container">
        <a href="/" id="navbar__logo">
          <img src="/public/images/UofA.png" alt="New Logo" style="height: 50px; width: 50px; margin-right: 10px;">
        </a>
        <span class="navbar__title">User Meal Entry</span>
      </div>
    </nav>
    <div class="container">
      <div class="entriesHeader">
        <br><span>Entries for Selected Date</span>
        <input type="date" id="currentDate" name="currentDate" required />
      </div>
      <table id="existingEntriesTable">
        <thead>
          <tr>
            <th>DateTime</th>
            <th>Food</th>
            <th>Phosphorous (mg)</th>
            <th>Potassium (mg)</th> <!-- Add header for Potassium -->
          </tr>
        </thead>
        <tbody id="existingEntriesBody"></tbody>
      </table>
      <br><h2>Add New Entry</h2>
      <form id="manualEntryForm">
        <div id="entriesContainer">
          <div class="entryRow">
            <label>Food Name:</label>
            <input type="text" name="food1" class="foodEntry">
            <label>Phosphorous (mg):</label>
            <input type="number" name="phosphorus1" class="phosphorusEntry" required>
            <label>Potassium (mg):</label>
            <input type="number" name="potassium1" class="potassiumEntry" required> <!-- Add Potassium input -->
          </div>
        </div>
        <div class="formButtons">
          <button id="addEntryButton">Add Another Entry</button>
          <button id="commitButton">Commit Update</button>
        </div>
      </form>
    </div>
  </body>
</html>
